/**:
  controller_manager:
    ros__parameters:
      update_rate: 400  # Hz
      thread_priority: 40
      cpu_affinity: [1, 2, 3]

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      gripper_controller:
        type: position_controllers/GripperActionController

      tdc_effort_controller:
        # type: omy_project/TdcPlugin
        type: forward_command_controller/ForwardCommandController

      # tdc_controller:
      #   type: omy_tdc_controller/OmyTdcController

/**:
  arm_controller:
    ros__parameters:
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6

      interface_name: effort

      command_interfaces:
        - effort

      state_interfaces:
        - position
        - velocity

      gains:
        joint1: {p: 100.0, i: 0.1, d: 1.0}
        joint2: {p: 150.0, i: 0.1, d: 1.0}
        joint3: {p: 120.0, i: 0.1, d: 1.0}
        joint4: {p: 80.0, i: 0.1, d: 0.5}
        joint5: {p: 50.0, i: 0.1, d: 0.5}
        joint6: {p: 30.0, i: 0.1, d: 0.5}
        # joint1: {p: 0.0, i: 0.0, d: 0.0}
        # joint2: {p: 0.0, i: 0.0, d: 0.0}
        # joint3: {p: 0.0, i: 0.0, d: 0.0}
        # joint4: {p: 0.0, i: 0.0, d: 0.0}
        # joint5: {p: 0.0, i: 0.0, d: 0.0}
        # joint6: {p: 0.0, i: 0.0, d: 0.0}

      allow_partial_joints_goal: true

/**:
  tdc_effort_controller:
    ros__parameters:
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6

      interface_name: effort

      allow_partial_joints_goal: true


